openapi: 3.0.3
info:
  title: Microservicio de resenas
  version: 1.0.0
  description: "**Colección:** `resenas` — Reseñas de productos escritas por clientes que los compraron.\n\
    \nContrato común a todos los microservicios del ejercicio.\n\n**Reglas generales**\n- El servicio\
    \ es de **solo lectura** y expone siempre las mismas rutas: `GET /health`, `GET /items` y `GET /items/{id}`.\n\
    - `GET /items` devuelve los elementos **ordenados por `id` ascendente**, con paginación `limit`/`offset`.\n\
    \  `total` es la cantidad de elementos que cumplen los filtros, sin considerar la paginación.\n- Los\
    \ filtros se combinan con AND. Los filtros de texto comparan por igualdad exacta sin distinguir mayúsculas.\n\
    - Un parámetro inválido (tipo, rango o valor fuera del enum) responde **400**. Un `id` inexistente\
    \ responde **404**.\n- Los errores usan siempre el formato `{ \"error\": \"<codigo>\", \"message\"\
    : \"<detalle>\" }`.\n- Los nombres de campos del documento coinciden con los del JSON de la semilla\
    \ (campo `id` como clave primaria).\n- Fechas en ISO 8601 UTC (`date-time`) o `YYYY-MM-DD` (`date`).\n"
  x-collection: resenas
  x-id-prefix: RES
servers:
- url: http://localhost:3000
  description: Local
- url: https://resenas-service.onrender.com
  description: Render
tags:
- name: Servicio
  description: Estado del servicio
- name: resenas
  description: Reseñas de productos escritas por clientes que los compraron.
paths:
  /health:
    get:
      operationId: getHealth
      summary: Estado del servicio
      tags:
      - Servicio
      description: Debe responder 200 si el servicio y su base de datos están operativos. `collection`
        debe coincidir con la colección que sirve este microservicio.
      responses:
        '200':
          description: Servicio operativo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /items:
    get:
      operationId: listItems
      summary: Lista de resenas
      tags:
      - resenas
      description: Devuelve una página de elementos de `resenas` ordenados por `id`.
      parameters:
      - name: productoId
        in: query
        required: false
        description: Filtra por producto.
        schema:
          type: string
          pattern: ^PRD[0-9]+$
      - name: clienteId
        in: query
        required: false
        description: Filtra por cliente.
        schema:
          type: string
          pattern: ^CLI[0-9]+$
      - name: puntajeMin
        in: query
        required: false
        description: Puntaje mayor o igual a este valor.
        schema:
          type: integer
          minimum: 1
          maximum: 5
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Página de resultados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemList'
        '400':
          $ref: '#/components/responses/BadRequest'
  /items/{id}:
    get:
      operationId: getItem
      summary: Detalle de un elemento de resenas
      tags:
      - resenas
      parameters:
      - name: id
        in: path
        required: true
        description: Identificador del elemento (por ejemplo `RES001`).
        schema:
          type: string
      responses:
        '200':
          description: El elemento solicitado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  parameters:
    Limit:
      name: limit
      in: query
      required: false
      description: Cantidad máxima de elementos a devolver.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Offset:
      name: offset
      in: query
      required: false
      description: Cantidad de elementos a saltear.
      schema:
        type: integer
        minimum: 0
        default: 0
  responses:
    BadRequest:
      description: Parámetros inválidos.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: bad_request
            message: El parámetro limit debe estar entre 1 y 100.
    NotFound:
      description: No existe un elemento con ese id.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: not_found
            message: No existe RES999.
  schemas:
    Item:
      type: object
      description: Reseñas de productos escritas por clientes que los compraron.
      required:
      - id
      - productoId
      - clienteId
      - puntaje
      - titulo
      - texto
      - fecha
      properties:
        id:
          type: string
          pattern: ^RES[0-9]+$
          description: Identificador único del recurso.
          example: RES001
        productoId:
          type: string
          pattern: ^PRD[0-9]+$
          description: Producto reseñado.
          example: PRD001
        clienteId:
          type: string
          pattern: ^CLI[0-9]+$
          description: Autor de la reseña.
          example: CLI001
        puntaje:
          type: integer
          description: Puntaje de 1 a 5.
          minimum: 1
          maximum: 5
          example: 5
        titulo:
          type: string
          description: Título de la reseña.
          example: Excelente equipo
        texto:
          type: string
          description: Texto libre de la reseña.
        fecha:
          type: string
          description: Fecha y hora de publicación.
          format: date-time
      example:
        id: RES001
        productoId: PRD001
        clienteId: CLI001
        puntaje: 5
        titulo: Excelente equipo
        texto: La cámara y la batería superaron mis expectativas.
        fecha: '2026-08-20T18:00:00Z'
    ItemList:
      type: object
      required:
      - items
      - total
      - limit
      - offset
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Item'
        total:
          type: integer
          minimum: 0
          description: Cantidad total de elementos que cumplen los filtros.
        limit:
          type: integer
          minimum: 1
          maximum: 100
        offset:
          type: integer
          minimum: 0
    Health:
      type: object
      required:
      - status
      - service
      - collection
      properties:
        status:
          type: string
          enum:
          - ok
        service:
          type: string
          description: Nombre del servicio (libre; por ejemplo el del grupo).
          example: grupo-03-resenas
        collection:
          type: string
          enum:
          - resenas
        version:
          type: string
          example: 1.0.0
    Error:
      type: object
      required:
      - error
      - message
      properties:
        error:
          type: string
          enum:
          - bad_request
          - not_found
        message:
          type: string
