services:
  - type: web
    name: resenas-service
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: resenas
      - key: SERVICE_NAME
        value: resenas-service
      - key: NODE_VERSION
        value: "22"
